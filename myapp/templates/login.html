{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block body %}
<h2>Login</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul style="color:red">
      {% for msg in messages %}
        <li>{{ msg }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('user.login_user') }}">
    <label>Username:</label>
    <input type="text" name="username" required><br><br>

    <label>Password:</label>
    <input type="password" name="password" required><br><br>

    <button type="submit">Login</button>
</form>

<p>Don't have an account? <a href="{{ url_for('user.signUp_user') }}">Sign Up</a></p>
{% endblock %}
